<style>
:root{

  for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return prefix + h.toString(16).padStart(8,"0"); }
const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

/* ---------- Zustand ---------- */

const stoff = () => S.stoffe[S.aktiv] || null;

const mcFertig = () => stoff().mc.filter(q => q.r && q.r.length);
function logToday(k){ const l = L(), d = new Date().toISOString().slice(0,10); l.log[d] = l.log[d] || {}; l.log[d][k] = (l.log[d][k]||0)+1; }
function toast(msg){ let t = $("#toast"); if (!t){ t = document.createElement("div"); t.id = "toast"; t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw;font-size:.92rem"; document.body.appendChild(t); }

    m_stat:"Schwachstellen &amp; Statistik", m_daten:"Daten: Fragenpaket &amp; Lernstand sichern, importieren", m_neu:"Neuen Stoff anlegen", m_hilfe:"So funktioniert die App", backMehr:"← Mehr",
    hilfeHtml:`<p style="margin-top:0"><b>Offline.</b> Nach dem ersten Öffnen läuft alles auf diesem Gerät: PDF-Lesen, Texterkennung für Fotos und Screenshots, Fragenerzeugung, Lernen. Kein Server, keine KI im Netz. Die Daten liegen nur in diesem Browser.</p>
  <p><b>Fragen erzeugen.</b> Die App sucht im Text zuerst nach vorhandenen Prüfungsfragen (Frage mit Antwortmöglichkeiten a/b/c, Kästchen, Lösungsangabe) und übernimmt sie. Aus Fließtext baut sie Definitionsfragen („Was ist …?“), Aufzählungen („Nenne alle …“), Lückentexte und Zahlenfragen; falsche Antwortmöglichkeiten kommen aus demselben Text. Überschriften werden zu Themen.</p>
  <p><b>Editor.</b> Weil Regeln keinen Verstand haben, lohnt der Blick in den Editor: unpassende Fragen löschen, Texte glätten, bei Prüfungsfragen ohne Lösungsangabe die richtige Antwort ankreuzen. Fragen ohne Kreuz werden nicht abgefragt.</p>
  <p><b>Lernen.</b> Karten folgen dem SM-2-Verfahren: nach jeder Bewertung rückt die nächste Wiederholung weiter in die Zukunft, bei „Nochmal“ kommt die Karte in 10 Minuten wieder. Fragen wandern bei Fehlern in die Fehlerliste und verlassen sie nach zwei richtigen Antworten in Folge. Die Simulation mischt Fragen über alle Themen und wertet erst am Ende aus.</p>
  <p><b>Sprache.</b> Je Stoff wählbar (Deutsch, Englisch oder Malayalam, beim Anlegen oder unter Stoff → Stoff verwalten). Sie bestimmt, welches Sprachpaket die Texterkennung nutzt und nach welchen Mustern Fragen gebaut werden. Die Sprache der Bedienung ist davon unabhängig und wird unter Mehr → Einstellungen gewählt.</p>

    hilfeHtml:`<p style="margin-top:0"><b>Offline.</b> After the first visit everything runs on this device: reading PDFs, text recognition for photos and screenshots, question generation, studying. No server, no online AI. Your data stays in this browser only.</p>
  <p><b>Generating questions.</b> The app first looks for existing exam questions in the text (question with options a/b/c, boxes, answer key) and takes them over. From running text it builds definition questions (“What is …?”), lists (“Name all …”), gap fills and number questions; wrong options come from the same text. Headings become topics.</p>
  <p><b>Editor.</b> Rules have no common sense, so check the editor: delete unsuitable questions, tidy up wording, and tick the correct answer for exam questions without an answer key. Questions without a tick are not asked.</p>
  <p><b>Studying.</b> Cards follow the SM-2 method: after each rating the next review moves further into the future; with “Again” the card returns in 10 minutes. Wrongly answered questions go to the error list and leave it after two correct answers in a row. The simulation mixes questions across all topics and only scores at the end.</p>
  <p><b>Language.</b> Each subject has its own language (German, English or Malayalam, set when creating it or under Subject → Manage subject). It decides which language pack text recognition uses and which patterns are used to build questions. The app's own language is separate and is set under More → Settings.</p>
  <p><b>Photos.</b> Well lit, straight, sharp, one page per photo. Text recognition needs a few seconds to prepare the first time and about 5–20 seconds per page.</p>`,

    hilfeHtml:`<p style="margin-top:0"><b>ഓഫ്‌ലൈൻ.</b> ആദ്യമായി തുറന്നശേഷം എല്ലാം ഈ ഉപകരണത്തിൽ തന്നെ പ്രവർത്തിക്കുന്നു: PDF വായന, ഫോട്ടോകൾക്കും സ്ക്രീൻഷോട്ടുകൾക്കും ടെക്സ്റ്റ് തിരിച്ചറിയൽ, ചോദ്യനിർമ്മാണം, പഠനം. സെർവറില്ല, ഓൺലൈൻ AI ഇല്ല. ഡാറ്റ ഈ ബ്രൗസറിൽ മാത്രം.</p>
  <p><b>ചോദ്യങ്ങൾ ഉണ്ടാക്കൽ.</b> ആപ്പ് ആദ്യം ടെക്സ്റ്റിൽ നിലവിലുള്ള പരീക്ഷാചോദ്യങ്ങൾ (a/b/c ഓപ്ഷനുകൾ, ബോക്സുകൾ, ഉത്തരസൂചിക) കണ്ടെത്തി എടുക്കുന്നു. സാധാരണ ടെക്സ്റ്റിൽ നിന്ന് നിർവചനചോദ്യങ്ങൾ, പട്ടികകൾ, വിട്ടഭാഗം പൂരിപ്പിക്കൽ, സംഖ്യാചോദ്യങ്ങൾ എന്നിവ ഉണ്ടാക്കുന്നു; തെറ്റായ ഓപ്ഷനുകൾ അതേ ടെക്സ്റ്റിൽ നിന്നാണ്. തലക്കെട്ടുകൾ വിഷയങ്ങളാകും.</p>
  <p><b>എഡിറ്റർ.</b> നിയമങ്ങൾക്ക് വിവേകമില്ല, അതിനാൽ എഡിറ്റർ നോക്കുന്നത് നല്ലതാണ്: അനുയോജ്യമല്ലാത്ത ചോദ്യങ്ങൾ ഇല്ലാതാക്കുക, വാചകം മെച്ചപ്പെടുത്തുക, ഉത്തരസൂചിക ഇല്ലാത്ത ചോദ്യങ്ങളിൽ ശരിയുത്തരം ടിക്ക് ചെയ്യുക. ടിക്ക് ഇല്ലാത്ത ചോദ്യങ്ങൾ ചോദിക്കില്ല.</p>
  <p><b>പഠനം.</b> കാർഡുകൾ SM-2 രീതി പിന്തുടരുന്നു: ഓരോ വിലയിരുത്തലിനും ശേഷം അടുത്ത ആവർത്തനം കൂടുതൽ ദൂരേക്ക് നീങ്ങുന്നു; „വീണ്ടും“ എങ്കിൽ കാർഡ് 10 മിനിറ്റിൽ തിരികെ വരും. തെറ്റിയ ചോദ്യങ്ങൾ തെറ്റുകളുടെ പട്ടികയിൽ പോകും, തുടർച്ചയായി രണ്ട് ശരിയുത്തരങ്ങൾക്ക് ശേഷം പുറത്തുപോകും. മാതൃകാപരീക്ഷ എല്ലാ വിഷയങ്ങളിൽ നിന്നും ചോദ്യങ്ങൾ കലർത്തി അവസാനം മാത്രം ഫലം നൽകുന്നു.</p>
  <p><b>ഭാഷ.</b> ഓരോ പാഠത്തിനും വെവ്വേറെ (ജർമ്മൻ, ഇംഗ്ലീഷ് അല്ലെങ്കിൽ മലയാളം; സൃഷ്ടിക്കുമ്പോഴോ പാഠം → പാഠം കൈകാര്യം ചെയ്യുക എന്നതിലോ). ടെക്സ്റ്റ് തിരിച്ചറിയലിന്റെ ഭാഷാപാക്കേജും ചോദ്യനിർമ്മാണ രീതികളും ഇത് നിശ്ചയിക്കുന്നു. ആപ്പിന്റെ ഭാഷ ഇതിൽ നിന്ന് വേറിട്ടതാണ്, കൂടുതൽ → ക്രമീകരണങ്ങൾ എന്നതിൽ മാറ്റാം.</p>
  <p><b>ഫോട്ടോകൾ.</b> നല്ല വെളിച്ചം, നേരെ, വ്യക്തമായി, ഒരു ഫോട്ടോയിൽ ഒരു പേജ്. ആദ്യതവണ ടെക്സ്റ്റ് തിരിച്ചറിയൽ തയ്യാറാകാൻ കുറച്ച് സെക്കൻഡ് എടുക്കും, ഓരോ പേജിനും ഏകദേശം 5–20 സെക്കൻഡ്.</p>`,

/* ---------- SM-2 ---------- */
function schedule(id, q){
  const l = L(); const c = l.cards[id] || {ef:2.5, iv:0, reps:0, lapses:0};
  if (q === 0){ c.reps = 0; c.lapses++; c.iv = 0; c.ef = Math.max(1.3, c.ef - .2); c.due = Date.now() + 10*60e3; }
  else {
    if (c.reps === 0) c.iv = q === 3 ? 3 : 1;
    else if (c.reps === 1) c.iv = q === 1 ? 3 : q === 2 ? 4 : 6;
    else c.iv = Math.round(c.iv * (q === 1 ? 1.2 : q === 2 ? c.ef : c.ef * 1.3));
    c.ef = Math.max(1.3, c.ef + (q === 1 ? -.15 : q === 3 ? .15 : 0));
    c.reps++; c.due = today() + c.iv * DAY;
  }
  c.last = Date.now(); l.cards[id] = c; logToday("karten"); save();
}
function preview(id, q){
  const c = L().cards[id] || {ef:2.5, iv:0, reps:0};
  if (q === 0) return "10 min";
  const iv = c.reps === 0 ? (q === 3 ? 3 : 1) : c.reps === 1 ? (q===1?3:q===2?4:6) : Math.round(c.iv*(q===1?1.2:q===2?c.ef:c.ef*1.3));
  return t("day", iv);
}
const dueEnd = () => today() + DAY;
const dueCards = () => stoff().karten.filter(c => L().cards[c.id] && L().cards[c.id].due < dueEnd());
const newCards = () => stoff().karten.filter(c => !L().cards[c.id]);
const newDoneToday = () => { const t = today(); return Object.values(L().cards).filter(c => c.first >= t).length; };
function pensum(){
  const l = L(), due = dueCards().length, offen = newCards().length;
  let neu = l.neuProTag, tage = null;
  if (l.pruefung){ tage = Math.ceil((new Date(l.pruefung).getTime() - today()) / DAY); if (tage > 0) neu = Math.ceil(offen / Math.max(1, tage - 3)); }
  return {due, neu: Math.min(offen, Math.max(0, neu - newDoneToday())), offen, tage};
}

window.addFiles = async files => {
  if (busy) { toast(t("waitFile")); return; }
  busy = true; const imgs = [];
  try {
    for (const f of Array.from(files || [])){
      try {
        if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) await addPdf(f);
        else if (/^image\//.test(f.type)) imgs.push(f);
        else toast(t("unsupported", f.name));
      } catch(e){ console.error(e); toast(t("cantRead", f.name, e.message || e)); }
    }
    if (imgs.length){
      let text = "";
      for (let i = 0; i < imgs.length; i++){ st(t("ocrImg", i+1, imgs.length)); const tx = await ocr(imgs[i], p => st(t("ocrImgP", i+1, imgs.length, Math.round(p*100)))); if (tx.trim()) text += (text ? "\n\n" : "") + tx.trim(); }
      if (text.replace(/\s/g,"").length < 40) toast(t("littleText"));
      else pend.push({name: imgs.length === 1 ? imgs[0].name : t("nImages", imgs.length, imgs[0].name), text, hinweis: t("fromOcr")});
    }
  } finally { busy = false; st(""); renderPend(); const fi = $("#fin"); if (fi) fi.value = ""; const fc = $("#fcam"); if (fc) fc.value = ""; }
};
async function addPdf(f){
  if (!window.pdfjsLib) throw new Error(t("noPdfLib"));
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  st(t("reading", f.name));
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  let text = "", ohne = [];
  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i), tc = await page.getTextContent();
    let pt = "", lastY = null;
    for (const it of tc.items){ if (!("str" in it)) continue; const y = it.transform ? Math.round(it.transform[5]) : null; if (lastY !== null && Math.abs(y - lastY) > 2 && !pt.endsWith("\n")) pt += "\n"; pt += it.str + (it.hasEOL ? "\n" : " "); lastY = y; }
    pt = pt.replace(/[ \t]+\n/g, "\n").replace(/ {2,}/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    if (pt.replace(/\s/g, "").length < 80) ohne.push(i); else text += `\n\n[Seite ${i}]\n` + pt;
    st(t("readingPage", f.name, i, pdf.numPages));
  }
  // Seiten ohne Textebene (Scan, Screenshot-PDF) per Texterkennung
  let ocrText = "";
  for (let k = 0; k < Math.min(ohne.length, 60); k++){
    const i = ohne[k], page = await pdf.getPage(i), vp = page.getViewport({scale: 2});
    const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    const tx = await ocr(cv, p => st(t("ocrPage", f.name, i, k+1, Math.min(ohne.length,60), Math.round(p*100))));
    if (tx.replace(/\s/g,"").length > 40) ocrText += `\n\n[Seite ${i}]\n` + tx.trim();
  }
  const all = (text + ocrText).trim();
  if (all.length < 40) throw new Error(t("noText"));
  pend.push({name: f.name, text: all, hinweis: ohne.length ? t("pagesOcr", ohne.length, ohne.length > 60) : ""});
}
let ocrWorker = null, ocrLang = "";
async function ocr(img, onP){
  if (!window.Tesseract) throw new Error(t("noOcr"));
  const lang = ({en:"eng", ml:"mal+eng"})[sprache()] || "deu";
  if (ocrWorker && ocrLang !== lang){ try { await ocrWorker.terminate(); } catch(e){} ocrWorker = null; }
  if (!ocrWorker){ st(t("ocrPrep")); ocrLang = lang;
    ocrWorker = await Tesseract.createWorker(lang, 1, {workerPath: "worker.min.js", corePath: ".", langPath: ".", gzip: true,
      logger: m => { if (m.status === "recognizing text" && onP) onP(m.progress || 0); }}); }
  const r = await ocrWorker.recognize(img);
  return (r.data && r.data.text) || "";
}
window.erzeugen = () => {
  const s = stoff(); if (!pend.length) return;
  const nK = +$("#gk").value, nQ = +$("#gq").value; let addK = 0, addQ = 0, offen = 0; const hin = [];
  for (const p of pend){
    const res = StoffGen.erzeugen(p.text, {nK, nQ, lang: sprache()});
    const id = uid(); s.quellen.push({id, name: p.name, zeichen: p.text.length, text: p.text.slice(0, 200000)});
    for (const k of res.karten){ const kid = hid("k", k.f); if (s.karten.some(x => x.id === kid)) continue; s.karten.push({id: kid, f: k.f, a: k.a, t: k.t || "", art: k.art, src: id}); addK++; }
    for (const q of res.mc){ const qid = hid("q", q.f); if (s.mc.some(x => x.id === qid)) continue; s.mc.push({id: qid, f: q.f, o: q.o, r: q.r || [], e: q.e || "", t: q.t || "", art: q.art, src: id}); addQ++; if (!q.r || !q.r.length) offen++; }
    hin.push(...res.hinweise);
  }
  pend = []; save();
  toast(t("added", addK, addQ, offen));
  go("editor", {todo: offen > 0, hinweise: hin});
};

let queue = [], cur = null, deckOpts = {};
V.karten = () => {
  const s = stoff(), l = L();
  const themen = [...new Set(s.karten.map(c => c.t))].sort();
  const rows = themen.map(t => { const cs = s.karten.filter(c => c.t === t), due = cs.filter(c => l.cards[c.id] && l.cards[c.id].due < dueEnd()).length, neu = cs.filter(c => !l.cards[c.id]).length;
    return `<tr><td>${esc(t || T[ui()].noTopic)}</td><td class="n">${due}</td><td class="n">${neu}</td><td class="n">${cs.length}</td></tr>`; }).join("");
  app(`<h2>${t("kartenTitle")}</h2><div class="card"><p class="small muted" style="margin-top:0">${t("kartenHint")}</p>
  <div class="row"><select id="kb">${topts("", s.karten)}</select><button class="btn p" onclick="go('lernen',{t:$('#kb').value})" ${s.karten.length?"":"disabled"}>${t("learn")}</button></div></div>
  ${rows ? `<div class="card tw"><table><tr><th>${t("thTopic")}</th><th class="n">${t("thDue")}</th><th class="n">${t("thNew")}</th><th class="n">${t("thTotal")}</th></tr>${rows}</table></div>` : `<div class="card muted">${t("noCards")}</div>`}`);
};
function buildQueue(o){
  const s = stoff(), l = L(), f = c => !o.t || c.t === o.t;
  const due = s.karten.filter(c => f(c) && l.cards[c.id] && l.cards[c.id].due < dueEnd()).sort((a,b) => l.cards[a.id].due - l.cards[b.id].due);
  const lim = o.t ? 20 : Math.max(pensum().neu, 0);
  return due.concat(s.karten.filter(c => f(c) && !l.cards[c.id]).slice(0, lim)).map(c => c.id);
}
V.lernen = o => { deckOpts = o || {}; queue = buildQueue(deckOpts); nextCard(); };
function nextCard(){
  const s = stoff(), l = L();
  if (!queue.length){ app(`<div class="card"><h2>${t("doneTitle")}</h2><p class="muted">${esc(mut("done"))}</p><p>${t("noDue", !!deckOpts.t)}</p>
    <div class="row"><button class="btn" onclick="go('karten')">${t("backPlain")}</button>${s.karten.some(c => !l.cards[c.id] && (!deckOpts.t||c.t===deckOpts.t)) ? `<button class="btn" onclick="extraNeu()">${t("more10")}</button>` : ""}</div></div>`); return; }
  cur = byId()[queue[0]]; if (!cur || !cur.f){ queue.shift(); return nextCard(); }
  app(`<div class="row" style="justify-content:space-between"><button class="btn sm" onclick="go('karten')">${t("quit")}</button><span class="small muted">${t("left", queue.length)}</span></div>
  <div class="card" style="margin-top:10px">${cur.t?`<span class="tag">${esc(cur.t)}</span>`:""}${!l.cards[cur.id]?` <span class="tag">${t("tagNew")}</span>`:""}
   <div class="q">${esc(cur.f)}</div>
   <div id="back" hidden><div class="ans">${esc(cur.a)}</div>
    <div class="rate">${t("rates").map((lb,i) => `<button class="btn" onclick="rate(${i})">${lb}<small>${preview(cur.id,i)}</small></button>`).join("")}</div></div>
   <button id="show" class="btn p" style="width:100%;margin-top:8px" onclick="$('#back').hidden=false;this.remove()">${t("showAns")}</button></div>
  <p class="small muted">${t("keysHint")}</p>`);
}
window.extraNeu = () => { const l = L(); queue = stoff().karten.filter(c => (!deckOpts.t || c.t === deckOpts.t) && !l.cards[c.id]).slice(0,10).map(c=>c.id); nextCard(); };
window.rate = q => { const id = queue.shift(), l = L(); const isNew = !l.cards[id]; schedule(id, q); if (isNew){ l.cards[id].first = Date.now(); save(); }
  if (q >= 2 && Math.random() < .3) toast(mut("card"));
  if (q === 0) queue.splice(Math.min(queue.length, 4), 0, id); nextCard(); };
document.addEventListener("keydown", e => {
  if (view !== "lernen" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === " " && $("#show")){ e.preventDefault(); $("#show").click(); }
  else if (/^[1-4]$/.test(e.key) && !$("#show") && $("#back")) rate(+e.key - 1);
});

  mcQ = pool.slice(0, o.fehler ? 30 : (o.n || 10)).map(q => ({q, perm: shuffle(q.o.map((_,i)=>i).filter(i => q.o[i]))})); mcI = 0; mcStats = {n:0, ok:0}; go("mc"); };
V.mc = () => {
  if (!mcQ.length) return go("fragen");
  if (mcI >= mcQ.length){ app(`<div class="card"><h2>${t("roundDone")}</h2><p>${t("roundRes", mcStats.ok, mcStats.n)}</p><p class="muted">${esc(mutRound(mcStats.ok, mcStats.n))}</p><div class="row"><button class="btn p" onclick="startMC(mcOpts)">${t("newRound")}</button><button class="btn" onclick="go('fragen')">${t("backPlain")}</button></div></div>`); return; }
  const {q, perm} = mcQ[mcI]; mcSel = []; const multi = q.r.length > 1;
  app(`<div class="row" style="justify-content:space-between"><button class="btn sm" onclick="go('fragen')">${t("quit")}</button><span class="small muted">${mcI+1} / ${mcQ.length}</span></div>
  <div class="card" style="margin-top:10px">${q.t?`<span class="tag">${esc(q.t)}</span>`:""}<div class="q">${esc(q.f)}</div>${multi?`<p class="small muted">${t("multiHint")}</p>`:""}
  <div id="opts">${perm.map((oi,k) => `<button class="opt" data-i="${oi}" onclick="mcPick(${oi},this)">${String.fromCharCode(65+k)}) ${esc(q.o[oi])}</button>`).join("")}</div>
  ${multi?`<button class="btn p" id="chk" onclick="mcCheck()">${t("check")}</button>`:""}<div id="fb"></div></div>`);
};
window.mcPick = (i, el) => { const {q} = mcQ[mcI]; if ($("#fb").innerHTML) return;
  if (q.r.length > 1){ el.classList.toggle("sel"); mcSel = mcSel.includes(i) ? mcSel.filter(x=>x!==i) : mcSel.concat(i); return; }
  mcSel = [i]; mcCheck(); };
window.mcCheck = () => {
  const {q} = mcQ[mcI], l = L(); if (!mcSel.length) return;
  const ok = mcSel.length === q.r.length && mcSel.every(i => q.r.includes(i));
  document.querySelectorAll("#opts .opt").forEach(b => { const i = +b.dataset.i; if (q.r.includes(i)) b.classList.add("ok"); else if (mcSel.includes(i)) b.classList.add("no"); b.disabled = true; });
  const m = l.mc[q.id] || {n:0, ok:0}; m.n++; if (ok) m.ok++; m.last = Date.now(); l.mc[q.id] = m;
  if (!ok) l.fehler[q.id] = 0; else if (q.id in l.fehler){ l.fehler[q.id]++; if (l.fehler[q.id] >= 2) delete l.fehler[q.id]; }
  mcStats.n++; if (ok) mcStats.ok++; logToday("fragen"); save();
  const st = q.id in l.fehler ? `<span class="small muted">${t("errState", l.fehler[q.id])}</span>` : "";
  $("#fb").innerHTML = `<div class="ans"><b class="${ok?"ok-t":"bad-t"}">${ok?t("right"):t("wrong")}</b> <span class="muted">${esc(mut(ok?"ok":"bad"))}</span>${st}${q.e?`<div style="margin-top:6px">${esc(q.e)}</div>`:""}</div>
   <button class="btn p" style="width:100%;margin-top:12px" onclick="mcI++;V.mc()">${t("next")}</button>`;
  const c = $("#chk"); if (c) c.remove();
};

/* ---------- Prüfungssimulation ---------- */
let sim = null;
V.pruefung = () => {
  const l = L(), fertig = mcFertig(), n = Math.min(S.simN, fertig.length);
  const hist = l.sims.slice().reverse().map(x => `<tr><td>${new Date(x.t).toLocaleString(loc(),{dateStyle:"short",timeStyle:"short"})}</td><td class="n">${x.ok}/${x.n}</td><td class="n">${x.pct} %</td><td class="n">${Math.round(x.dauer/60)} min</td></tr>`).join("");
  app(`<h2>${t("simTitle")}</h2><div class="card prose"><p style="margin-top:0">${t("simHint")}</p>
  <div class="row"><label class="small muted" for="sn">${t("qs")}</label><select id="sn" onchange="S.simN=+this.value;save();V.pruefung()">${[10,15,20,30,40,50].map(x=>`<option ${S.simN==x?"selected":""}>${x}</option>`).join("")}</select>
  <label class="small muted" for="sm">${t("mins")}</label><select id="sm" onchange="S.simMin=+this.value;save()">${[10,15,20,30,45,60,90].map(x=>`<option ${S.simMin==x?"selected":""}>${x}</option>`).join("")}</select></div>
  <p class="small muted">${t("simAvail", fertig.length, fertig.length < S.simN)}</p>
  ${sim && !sim.done ? `<button class="btn p" onclick="go('sim')">${t("resume")}</button>` : `<button class="btn p" onclick="simStart()" ${n>=5?"":"disabled"}>${t("simStart")}</button>`}</div>
  <div class="card"><h3 style="margin-top:0">${t("history")}</h3>${hist ? `<div class="tw"><table><tr><th>${t("thDate")}</th><th class="n">${t("thRight")}</th><th class="n">${t("thRate")}</th><th class="n">${t("thDur")}</th></tr>${hist}</table></div>` : `<p class="muted">${t("noSim")}</p>`}</div>`);
};
window.simStart = () => {
  const fertig = mcFertig(), N = Math.min(S.simN, fertig.length), pool = shuffle(fertig.slice()), by = {};
  pool.forEach(q => (by[q.t] = by[q.t] || []).push(q));
  const pick = [], keys = shuffle(Object.keys(by));
  while (pick.length < N && keys.some(k => by[k].length)) for (const k of keys){ if (pick.length >= N) break; const q = by[k].pop(); if (q) pick.push(q); }
  sim = {qs: shuffle(pick).map(q => ({id:q.id, perm: shuffle(q.o.map((_,i)=>i).filter(i => q.o[i])), a:null})), i:0, start:Date.now(), done:false, min:S.simMin};
  go("sim");
};
function simTick(){ if (!sim || sim.done){ clearInterval(timerH); timerH = null; return; }
  const left = sim.start + sim.min*60e3 - Date.now(); if (left <= 0){ simEnd(); return; }
  const t = `${Math.floor(left/60e3)}:${String(Math.floor(left/1e3)%60).padStart(2,"0")}`; $("#hdr").textContent = t; const e = $("#tm"); if (e) e.textContent = t; }
V.sim = () => {
  if (!sim || sim.done) return go("pruefung");
  if (!timerH) timerH = setInterval(simTick, 1000);
  const m = byId(), N = sim.qs.length, s = sim.qs[sim.i], q = m[s.id], answered = sim.qs.filter(x => x.a !== null).length;
  if (!q){ sim.qs.splice(sim.i,1); sim.i = Math.min(sim.i, sim.qs.length-1); return sim.qs.length ? V.sim() : simEnd(); }
  const multi = q.r.length > 1, sel = Array.isArray(s.a) ? s.a : (s.a === null ? [] : [s.a]);
  app(`<div class="row" style="justify-content:space-between"><span class="timer">⏱ <span id="tm"></span></span><span class="small muted">${t("answered", answered, N)}</span></div>
  <div class="card" style="margin-top:10px"><span class="small muted">${t("qOf", sim.i+1, N)}${multi?t("multiShort"):""}</span><div class="q">${esc(q.f)}</div>
  ${s.perm.map((oi,k) => `<button class="opt ${sel.includes(oi)?"sel":""}" onclick="simPick(${oi},${multi})">${String.fromCharCode(65+k)}) ${esc(q.o[oi])}</button>`).join("")}
  <div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn" onclick="sim.i--;V.sim()" ${sim.i?"":"disabled"}>${t("back")}</button>
  <button class="btn ${sim.i<N-1?"p":""}" onclick="sim.i++;V.sim()" ${sim.i<N-1?"":"disabled"}>${t("nextArrow")}</button></div></div>
  <div class="card"><div class="grid50">${sim.qs.map((x,k) => `<button class="${x.a!==null?"a":""} ${k===sim.i?"c":""}" onclick="sim.i=${k};V.sim()">${k+1}</button>`).join("")}</div>
  <div class="row" style="margin-top:12px"><button class="btn p" onclick="askAbgabe()">${t("submit")}</button></div><div id="abg"></div></div>`);
  simTick();
};
window.simPick = (oi, multi) => { const s = sim.qs[sim.i]; if (!multi){ s.a = oi; } else { const sel = Array.isArray(s.a) ? s.a : []; s.a = sel.includes(oi) ? sel.filter(x => x !== oi) : sel.concat(oi); if (!s.a.length) s.a = null; } V.sim(); };
window.askAbgabe = () => { const open = sim.qs.filter(x => x.a === null).length; $("#abg").innerHTML = `<div class="confirm">${open ? t("openQ", open) : ""}${t("submitQ")}<div class="row" style="margin-top:8px"><button class="btn p" onclick="simEnd()">${t("yesSubmit")}</button><button class="btn sm" onclick="$('#abg').innerHTML=''">${t("keepEdit")}</button></div></div>`; };
window.simEnd = () => {
  if (!sim || sim.done) return; sim.done = true; clearInterval(timerH); timerH = null; $("#hdr").textContent = "";
  const m = byId(), l = L(), N = sim.qs.length;
  const detail = sim.qs.map(x => { const q = m[x.id]; const sel = Array.isArray(x.a) ? x.a : (x.a === null ? [] : [x.a]); return {id:x.id, t:q ? q.t : "", a:sel, ok: !!q && sel.length === q.r.length && sel.every(i => q.r.includes(i))}; });
  const ok = detail.filter(d => d.ok).length, pct = N ? Math.round(1000*ok/N)/10 : 0;
  detail.filter(d => !d.ok).forEach(d => l.fehler[d.id] = 0);
  const res = {t:Date.now(), n:N, ok, pct, dauer: Math.round((Date.now()-sim.start)/1000), detail};
  l.sims.push(res); save(); go("simres", res);
};
V.simres = r => {
  r = r || L().sims[L().sims.length-1]; const m = byId(), by = {};
  r.detail.forEach(d => { by[d.t] = by[d.t] || {n:0, ok:0}; by[d.t].n++; if (d.ok) by[d.t].ok++; });
  app(`<div class="card"><h2 style="margin-top:0">${t("resTitle", r.ok, r.n, r.pct)}</h2>
  <p>${esc(mutSim(r.pct))}</p><p class="muted small">${t("duration", Math.round(r.dauer/60))}</p>
  <div class="tw"><table><tr><th>${t("thTopic")}</th><th class="n">${t("thRight")}</th><th class="n">${t("thRate")}</th></tr>${Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([t,s]) => `<tr><td>${esc(t||T[ui()].noTopic)}</td><td class="n">${s.ok}/${s.n}</td><td class="n">${Math.round(100*s.ok/s.n)} %</td></tr>`).join("")}</table></div></div>
  <h3>${t("review")}</h3>${r.detail.map((d,k) => { const q = m[d.id]; if (!q) return ""; const sel = Array.isArray(d.a) ? d.a : (d.a === null ? [] : [d.a]); return `<div class="card small"><b>${k+1}. ${esc(q.f)}</b>
   ${q.o.map((o,i) => `<div class="${q.r.includes(i)?"ok-t":sel.includes(i)?"bad-t":"muted"}">${q.r.includes(i)?"✓":sel.includes(i)?"✗":"·"} ${esc(o)}</div>`).join("")}${!sel.length?`<div class="bad-t">${t("notAnswered")}</div>`:""}${q.e?`<div class="muted" style="margin-top:4px">${esc(q.e)}</div>`:""}</div>`; }).join("")}
  <button class="btn" onclick="go('pruefung')">${t("backPlain")}</button>`);
};

/* ---------- Mehr ---------- */
V.mehr = () => app(`<h2>${t("mehrTitle")}</h2>
  <div class="card"><h3 style="margin-top:0">${t("settings")}</h3><div class="row"><label for="uil" class="small muted">${t("uiLang")}</label><select id="uil" onchange="setUiLang(this.value)">${UI_LANGS.map(([v,n]) => `<option value="${v}" ${ui()===v?"selected":""}>${n}</option>`).join("")}</select></div></div>
  <div class="card list">
  <button class="item" onclick="go('stat')"><span>${t("m_stat")}</span><span></span></button>
  <button class="item" onclick="go('daten')"><span>${t("m_daten")}</span><span></span></button>
  <button class="item" onclick="go('neu')"><span>${t("m_neu")}</span><span></span></button>
  <button class="item" onclick="go('hilfe')"><span>${t("m_hilfe")}</span><span></span></button></div>`);
V.hilfe = () => app(`<button class="btn sm" onclick="go('mehr')">${t("backMehr")}</button><h2>${t("m_hilfe")}</h2><div class="card prose">
  ${t("hilfeHtml")}</div>`);
V.stat = () => {
  const s = stoff(), l = L();
  const themen = [...new Set(s.mc.map(q => q.t))];
  const weak = themen.map(t => ({t, s: themaStat(t)})).filter(r => r.s.n).sort((a,b) => (1-b.s.ok/b.s.n) - (1-a.s.ok/a.s.n));
  const hart = s.karten.filter(c => l.cards[c.id] && l.cards[c.id].lapses >= 2).sort((a,b)=>l.cards[b.id].lapses-l.cards[a.id].lapses).slice(0,15);
  const days = Object.keys(l.log).sort().slice(-14);
  const tot = {k: Object.keys(l.cards).length, f: Object.values(l.mc).reduce((a,m)=>a+m.n,0), ok: Object.values(l.mc).reduce((a,m)=>a+m.ok,0)};
  app(`<h2>${t("weakTitle")}</h2><div class="card tw">${weak.length ? `<table><tr><th>${t("thTopic")}</th><th class="n">${t("thErr")}</th><th class="n">${t("thAnswered")}</th><th></th></tr>${weak.map(r => `<tr><td>${esc(r.t||t("noTopic"))}</td><td class="n">${Math.round(100*(1-r.s.ok/r.s.n))} %</td><td class="n">${r.s.n}</td><td><button class="btn sm" onclick="startMC({t:'${esc(r.t).replace(/'/g,"")}',n:20})">${t("practice")}</button></td></tr>`).join("")}</table>` : `<p class="muted">${t("noneAnswered")}</p>`}</div>
  ${hart.length ? `<div class="card"><h3 style="margin-top:0">${t("forgotten")}</h3><ul class="small">${hart.map(c => `<li>${esc(c.f)} <span class="muted">(${l.cards[c.id].lapses}×)</span></li>`).join("")}</ul></div>` : ""}
  <h2>${t("statTitle")}</h2><div class="kpi"><div><span class="muted small">${t("kStarted")}</span><b>${tot.k}/${s.karten.length}</b></div><div><span class="muted small">${t("kAnswered")}</span><b>${tot.f}</b></div><div><span class="muted small">${t("kRight")}</span><b>${tot.f?Math.round(100*tot.ok/tot.f)+" %":"–"}</b></div></div>
  <div class="card" style="margin-top:14px"><h3 style="margin-top:0">${t("last14")}</h3>${days.length ? `<table><tr><th>${t("thDay")}</th><th class="n">${t("thCards")}</th><th class="n">${t("thQs")}</th></tr>${days.reverse().map(d => `<tr><td>${new Date(d).toLocaleDateString(loc())}</td><td class="n">${l.log[d].karten||0}</td><td class="n">${l.log[d].fragen||0}</td></tr>`).join("")}</table>` : `<p class="muted">${t("nothingYet")}</p>`}</div>`);
};
V.daten = () => app(`<h2>${t("datenTitle")}</h2>
  <div class="card prose"><h3 style="margin-top:0">${t("pkgTitle")}</h3><p>${t("pkgText")}</p>
  <div class="row"><button class="btn p" onclick="exportStoff()" ${stoff()?"":"disabled"}>${t("exportCur")}</button><label class="btn" for="impP">${t("importPkg")}</label><input type="file" id="impP" accept="application/json,.json" hidden onchange="importPaket(this.files[0])"></div>
  <details class="small muted" style="margin-top:10px"><summary>${t("formatSum")}</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">{"stofftrainer":1,"name":"Fahrradprüfung",
 "karten":[{"t":"Thema","f":"Frage","a":"Antwort"}],
 "mc":[{"t":"Thema","f":"Frage","o":["A","B","C","D"],"r":0,"e":"Erklärung"}]}</pre></details></div>
  <div class="card prose"><h3 style="margin-top:0">${t("backupTitle")}</h3><p>${t("backupText")}</p>
  <div class="row"><button class="btn" onclick="exportAll()">${t("exportAll")}</button><label class="btn" for="impA">${t("importBackup")}</label><input type="file" id="impA" accept="application/json,.json" hidden onchange="importAll(this.files[0])"></div></div>`);
function saveFile(fn, json){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], {type:"application/json"})); a.download = fn; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9äöüß]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "stoff";
window.exportStoff = () => { const s = stoff(); if (!s) return; saveFile("stofftrainer-" + slug(s.name) + ".json", JSON.stringify({stofftrainer:1, name:s.name, sprache:s.sprache||"de", karten:s.karten.map(({f,a,t})=>({t,f,a})), mc:s.mc.map(({f,o,r,e,t})=>({t,f,o,r,e}))}, null, 1)); };
window.exportAll = () => saveFile("stofftrainer-sicherung-" + new Date().toISOString().slice(0,10) + ".json", JSON.stringify(S, null, 1));
function readJson(f, cb){ if (!f) return; const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch(e){ toast(t("badJson")); } }; r.readAsText(f); }
window.importPaket = f => readJson(f, j => {
  if (!j || (!Array.isArray(j.karten) && !Array.isArray(j.mc))){ toast(t("notPkg")); return; }
  const name = String(j.name || t("importedName")).slice(0,60);
  let s = Object.values(S.stoffe).find(x => x.name === name);
  if (!s){ const id = uid(); s = S.stoffe[id] = {id, name, sprache: ["en","ml"].includes(j.sprache) ? j.sprache : "de", erstellt:Date.now(), quellen:[], karten:[], mc:[], lern:freshLern()}; }
  const src = uid(); s.quellen.push({id:src, name:t("importSrc") + (f.name||""), zeichen:0});
  let nk = 0, nq = 0;
  for (const k of j.karten || []){ if (!k || !k.f || !k.a) continue; const id = hid("k", k.f); if (s.karten.some(x=>x.id===id)) continue; s.karten.push({id, f:String(k.f), a:String(k.a), t:String(k.t||""), art:"import", src}); nk++; }
  for (const q of j.mc || []){ if (!q || !q.f || !Array.isArray(q.o)) continue; const r = (Array.isArray(q.r) ? q.r : [q.r]).map(Number).filter(x => x >= 0 && x < q.o.length);
    const id = hid("q", q.f); if (s.mc.some(x=>x.id===id)) continue; s.mc.push({id, f:String(q.f), o:q.o.map(String), r, e:String(q.e||""), t:String(q.t||""), art:"import", src}); nq++; }
  S.aktiv = s.id; save(); toast(t("imported", nk, nq, s.name)); go("start");
});
window.importAll = f => readJson(f, j => { if (!j || !j.stoffe){ toast(t("notBackup")); return; } S = Object.assign(fresh(), j); if (!S.stoffe[S.aktiv]) S.aktiv = Object.keys(S.stoffe)[0] || ""; save(); toast(t("backupOk")); applyUi(); go("start"); });

/* ---------- Service Worker ---------- */
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const nw = reg.installing; nw && nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) $("#upd").hidden = false; }); });
  }).catch(() => {});
}
Object.assign(window, {go, V, L, stoff, t});
applyUi();
go(stoff() ? "start" : "neu");
</script>
</body>
</html>
